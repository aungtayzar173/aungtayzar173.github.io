<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ATZ ဝင်ငွေ ထွက်ငွေ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: sans-serif; background:#f4f6f8; color:#1c2733; font-size:15px; }
  header { background:#0d2137; color:#fff; padding:14px 16px 12px; display:flex; align-items:center; gap:12px; }
  header img { width:52px; height:52px; border-radius:12px; }
  header h1 { font-size:19px; margin:0; }
  header .sub { font-size:12.5px; opacity:.85; margin-top:2px; }
  .wrap { padding:12px; max-width:640px; margin:0 auto; }
  .card { background:#fff; border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .card h2 { font-size:16px; margin:0 0 10px; color:#0d2137; }
  .sum-row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed #e3e8ee; }
  .sum-row:last-of-type { border-bottom:none; }
  .sum-row .lbl { color:#5a6a7a; }
  .in { color:#1d9e57; font-weight:bold; }
  .out { color:#d33; font-weight:bold; }
  .bal { font-weight:bold; color:#0d2137; }
  .big-bal { text-align:center; padding:10px 0 2px; }
  .big-bal .cap { color:#5a6a7a; font-size:13px; }
  .big-bal .val { font-size:30px; font-weight:bold; color:#0d2137; }
  .seg { display:flex; gap:8px; margin-bottom:10px; }
  .seg button { flex:1; padding:11px; font-size:16px; border-radius:10px; border:2px solid #c9d4de; background:#fff; color:#5a6a7a; }
  .seg button.act-in { background:#1d9e57; border-color:#1d9e57; color:#fff; font-weight:bold; }
  .seg button.act-out { background:#d33; border-color:#d33; color:#fff; font-weight:bold; }
  label.f { display:block; font-size:13px; color:#5a6a7a; margin:10px 0 4px; }
  input, select { width:100%; padding:11px; font-size:16px; border:1.5px solid #c9d4de; border-radius:10px; background:#fff; }
  input:focus, select:focus { outline:none; border-color:#7b2d8b; }
  .hint { color:#d33; font-size:13px; min-height:18px; margin-top:6px; }
  .btn { width:100%; padding:12px; font-size:16px; border:none; border-radius:10px; background:#0d2137; color:#fff; margin-top:10px; }
  .btn.save { background:#7b2d8b; font-weight:bold; }
  .btn.danger { background:#fff; color:#d33; border:1.5px solid #d33; }
  .btn.danger.armed { background:#d33; color:#fff; font-weight:bold; }
  .btn.ghost { background:#eef2f6; color:#0d2137; }
  .month-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .month-nav button { padding:8px 12px; border-radius:8px; border:1.5px solid #c9d4de; background:#fff; font-size:14px; }
  .month-nav .m { font-weight:bold; font-size:16px; }
  .day-head { display:flex; justify-content:space-between; align-items:baseline; background:#eef2f6; border-radius:8px; padding:7px 10px; margin:12px 0 4px; }
  .day-head .d { font-weight:bold; }
  .day-head .t { font-size:12.5px; color:#5a6a7a; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:9px 6px; border-bottom:1px solid #eef2f6; cursor:pointer; }
  .row .cat { font-weight:bold; }
  .row .note { color:#8a97a5; font-size:12.5px; }
  .row .amt { font-weight:bold; white-space:nowrap; margin-left:10px; }
  .empty { color:#8a97a5; text-align:center; padding:14px 0; }
  .bal-bar { display:flex; justify-content:space-between; align-items:center; background:#0d2137; color:#fff; border-radius:10px; padding:13px 14px; margin-top:14px; }
  .bal-bar .bb-lbl { font-size:14px; }
  .bal-bar .bb-val { font-size:22px; font-weight:bold; }
  .bal-bar .bb-val.sm { font-size:16.5px; }
  .bal-bar .bb-val.neg { color:#ff7070; }
  .cat-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #e3e8ee; }
  .cat-row:last-child { border-bottom:none; }
  .sub-h { font-size:14px; font-weight:bold; margin:10px 0 2px; }
  .row .eh { color:#c3cedb; font-size:12px; margin-left:7px; }
  .exp-cap { color:#5a6a7a; font-size:13px; margin-top:14px; }
  .exp-row { display:flex; gap:8px; margin-top:8px; }
  .exp-row .btn { margin-top:0; flex:1; }
  #print-area { display:none; }
  @media print {
    header, .wrap, footer { display:none !important; }
    #print-area { display:block; font-family:sans-serif; color:#000; padding:8px; }
    #print-area h1 { font-size:18px; margin:0 0 2px; }
    #print-area .p-sub { color:#444; font-size:12.5px; margin-bottom:10px; }
    #print-area table { width:100%; border-collapse:collapse; font-size:12.5px; }
    #print-area th, #print-area td { border:1px solid #999; padding:5px 6px; text-align:left; }
    #print-area td.n, #print-area th.n { text-align:right; white-space:nowrap; }
    #print-area tr.tot td { font-weight:bold; background:#eee; }
  }
  textarea { width:100%; min-height:110px; padding:10px; font-size:14px; border:1.5px solid #c9d4de; border-radius:10px; margin-top:10px; }
  footer { text-align:center; color:#8a97a5; font-size:12.5px; padding:6px 0 20px; }
</style>
</head>

  <div>
    <h1>ATZ ဝင်ငွေ ထွက်ငွေ</h1>
    <div class="sub">နေ့စဉ် ပိုက်ဆံ မှတ်တမ်း</div>
  </div>
</header>
<div class="wrap">

  <!-- Section 1: summary -->
  <div class="card">
    <h2>အနှစ်ချုပ်</h2>
    <div class="sum-row"><span class="lbl">ဒီနေ့</span><span><span class="in" id="t-in"></span> • <span class="out" id="t-out"></span> • <span class="bal" id="t-bal"></span></span></div>
    <div class="sum-row"><span class="lbl">ဒီလ</span><span><span class="in" id="m-in"></span> • <span class="out" id="m-out"></span> • <span class="bal" id="m-bal"></span></span></div>
    <div class="big-bal"><div class="cap">အသုံး လက်ကျန် (လက်ရှိ)</div><div class="val" id="big-bal"></div></div>
    <div class="sum-row"><span class="lbl">စုငွေ</span><span>စုစုပေါင်း <span class="bal" id="big-save"></span></span></div>
  </div>

  <!-- Section 2: entry form -->
  <div class="card">
    <h2 id="form-title">ထည့်ရန်</h2>
    <div class="seg">
      <button type="button" id="type-in">ဝင်ငွေ</button>
      <button type="button" id="type-out">ထွက်ငွေ</button>
    </div>
    <label class="f">ငွေပမာဏ (ကျပ်)</label>
    <input type="text" id="f-amount" inputmode="numeric" placeholder="ဥပမာ 5000">
    <label class="f">အမျိုးအစား</label>
    <select id="f-cat"></select>
    <div id="f-custom-wrap" style="display:none">
      <label class="f">ကိုယ်ပိုင် အမျိုးအစား အမည် ရေးပါ</label>
      <input type="text" id="f-custom" placeholder="ဥပမာ ဆိုင်လခ">
    </div>
    <label class="f">မှတ်ချက် (မထည့်လည်း ရ)</label>
    <input type="text" id="f-note" placeholder="ဥပမာ KBZPay နဲ့ ရ">
    <label class="f">ရက်စွဲ</label>
    <input type="date" id="f-date">
    <div class="hint" id="f-hint"></div>
    <button type="button" class="btn save" id="f-save">ထည့်မယ်</button>
    <button type="button" class="btn ghost" id="f-cancel" style="display:none">မပြင်တော့ပါ</button>
    <button type="button" class="btn danger" id="f-del" style="display:none">ဒီ မှတ်တမ်း ဖျက်မယ်</button>
  </div>

  <!-- Section 3: history -->
  <div class="card">
    <h2>စာရင်း</h2>
    <div class="month-nav">
      <button type="button" id="m-prev">◀ အရင်လ</button>
      <span class="m" id="m-label"></span>
      <button type="button" id="m-next">နောက်လ ▶</button>
    </div>
    <div id="hist"></div>
    <div class="bal-bar" id="hist-bal" style="display:none"></div>
    <div class="exp-cap">ထုတ်မယ် — အခု ပြထား တဲ့ လ အတွက် ပဲ ထုတ် ပါတယ် (save ချင် မှ နှိပ်ပါ)</div>
    <div class="exp-row">
      <button type="button" class="btn ghost" id="btn-csv">📊 Excel ထုတ်မယ်</button>
      <button type="button" class="btn ghost" id="btn-print">🖨️ Print ထုတ်မယ်</button>
    </div>
    <div class="hint" id="exp-hint" style="color:#5a6a7a"></div>
  </div>

  <!-- Section 4: by category -->
  <div class="card" id="catcard">
    <h2>အမျိုးအစား အလိုက်</h2>
    <div id="cat-body"></div>
  </div>

  <!-- Section 5: share + settings -->
  <div class="card">
    <h2>Share နှင့် ဆက်တင်</h2>
    <button type="button" class="btn" id="btn-share">ဒီလ အနှစ်ချုပ် Share မယ်</button>
    <textarea id="share-box" readonly style="display:none"></textarea>
    <label class="f">စတင် လက်ကျန် (ကျပ်)</label>
    <input type="text" id="s-opening" inputmode="numeric" placeholder="0">
    <button type="button" class="btn ghost" id="s-save">စတင် လက်ကျန် သိမ်းမယ်</button>
    <button type="button" class="btn danger" id="btn-clear">မှတ်တမ်း အားလုံး ရှင်းမယ်</button>
  </div>

  <footer>ATZ ဝင်ငွေ ထွက်ငွေ v1.4</footer>
</div>
<div id="print-area"></div>

<script>
(function () {
  'use strict';
  var EKEY = 'atzmoney.entries.v1', SKEY = 'atzmoney.settings.v1';
  var CATS_IN = ['ရောင်းရ', 'လစာ', 'စုငွေထုတ်', 'အခြား ဝင်ငွေ'];
  var OTHER_IN = 'အခြား ဝင်ငွေ', OTHER_OUT = 'အခြား';
  function isOther(v) { return v === OTHER_IN || v === OTHER_OUT; }
  function syncCustom() { $('f-custom-wrap').style.display = isOther($('f-cat').value) ? 'block' : 'none'; }
  var CATS_OUT = ['ဈေးဝယ်', 'စားစရိတ်', 'ခရီးစရိတ်', 'ဖုန်းဘေလ်/အင်တာနက်', 'ဆေး', 'အိမ်လခ', 'ကလေး အသုံးစရိတ်', 'ကျူရှင် လခ', 'စုငွေ', 'အခြား'];
  var SAVE_OUT = 'စုငွေ', SAVE_IN = 'စုငွေထုတ်';
  var MONTHS = ['ဇန်နဝါရီ','ဖေဖော်ဝါရီ','မတ်','ဧပြီ','မေ','ဇွန်','ဇူလိုင်','ဩဂုတ်','စက်တင်ဘာ','အောက်တိုဘာ','နိုဝင်ဘာ','ဒီဇင်ဘာ'];
  var WDAYS = ['တနင်္ဂနွေ','တနင်္လာ','အင်္ဂါ','ဗုဒ္ဓဟူး','ကြာသပတေး','သောကြာ','စနေ'];

  function $(id) { return document.getElementById(id); }
  function load(key, dflt) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : dflt; } catch (e) { return dflt; } }
  function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function monthOf(dateStr) { return dateStr.slice(0, 7); }
  function fmt(n) { var neg = n < 0; var s = String(Math.abs(Math.round(n))); var out = ''; while (s.length > 3) { out = '.' + s.slice(-3) + out; s = s.slice(0, -3); } return (neg ? '-' : '') + s + out; }
  function fmtK(n) { return fmt(n) + ' ကျပ်'; }
  function monthLabel(ym) { return ym.slice(0, 4) + ' ' + MONTHS[parseInt(ym.slice(5, 7), 10) - 1]; }
  function weekdayOf(dateStr) { var p = dateStr.split('-'); return WDAYS[new Date(+p[0], +p[1] - 1, +p[2]).getDay()]; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function uid() { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  var entries = load(EKEY, []);
  if (!Array.isArray(entries)) entries = [];
  var settings = load(SKEY, { opening: 0 });
  if (typeof settings.opening !== 'number' || !isFinite(settings.opening)) settings.opening = 0;

  var formType = 'out', editId = null;
  var viewMonth = monthOf(todayStr());

  /* ---------- form ---------- */
  function fillCats() {
    var cats = formType === 'in' ? CATS_IN : CATS_OUT;
    var sel = $('f-cat'); var cur = sel.value;
    sel.innerHTML = cats.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
    if (cats.indexOf(cur) >= 0) sel.value = cur;
    syncCustom();
  }
  function syncTypeBtns() {
    $('type-in').className = formType === 'in' ? 'act-in' : '';
    $('type-out').className = formType === 'out' ? 'act-out' : '';
  }
  function setType(t) { formType = t; syncTypeBtns(); fillCats(); }
  $('type-in').addEventListener('click', function () { disarmDel(); setType('in'); });
  $('type-out').addEventListener('click', function () { disarmDel(); setType('out'); });

  var DEL_LABEL = 'ဒီ မှတ်တမ်း ဖျက်မယ်', DEL_ARM = 'တကယ် ဖျက်မှာ သေချာလား? ထပ် နှိပ်ပါ', delTimer = null;
  function disarmDel() {
    var b = $('f-del'); b.dataset.armed = ''; b.classList.remove('armed'); b.textContent = DEL_LABEL;
    if (delTimer) { clearTimeout(delTimer); delTimer = null; }
  }
  function setEditMode(id) {
    editId = id;
    $('form-title').textContent = id ? 'ပြင်ရန်' : 'ထည့်ရန်';
    $('f-save').textContent = id ? 'ပြင်ပြီး သိမ်းမယ်' : 'ထည့်မယ်';
    $('f-cancel').style.display = id ? 'block' : 'none';
    $('f-del').style.display = id ? 'block' : 'none';
    disarmDel();
  }
  $('f-del').addEventListener('click', function () {
    if (!editId) return;
    var b = $('f-del');
    if (b.dataset.armed !== '1') {
      b.dataset.armed = '1'; b.textContent = DEL_ARM; b.classList.add('armed');
      if (delTimer) clearTimeout(delTimer);
      delTimer = setTimeout(disarmDel, 2600);
      return;
    }
    entries = entries.filter(function (e) { return e.id !== editId; });
    save(EKEY, entries);
    exitEdit();
    renderAll();
  });
  function exitEdit() {
    setEditMode(null);
    $('f-amount').value = ''; $('f-note').value = ''; $('f-custom').value = ''; $('f-hint').textContent = '';
    syncCustom();
  }
  $('f-cancel').addEventListener('click', function () { exitEdit(); });
  $('f-amount').addEventListener('input', disarmDel);
  $('f-note').addEventListener('input', disarmDel);
  $('f-date').addEventListener('input', disarmDel);
  $('f-date').addEventListener('change', disarmDel);
  $('f-cat').addEventListener('change', function () { disarmDel(); syncCustom(); });
  $('f-custom').addEventListener('input', disarmDel);

  /* live dot-format while typing (300000000 -> 300.000.000) */
  function fmtLive(el) { var digs = el.value.replace(/[^0-9]/g, ''); el.value = digs ? fmt(parseInt(digs, 10)) : ''; }
  function parseAmt(v) { var s = String(v == null ? '' : v); var neg = s.replace(/^\s+/, '').charAt(0) === '-'; var digs = s.replace(/[^0-9]/g, ''); if (!digs) return NaN; var n = parseInt(digs, 10); return neg ? -n : n; }
  $('f-amount').addEventListener('input', function () { fmtLive($('f-amount')); });
  $('s-opening').addEventListener('input', function () { fmtLive($('s-opening')); });

  $('f-save').addEventListener('click', function () {
    disarmDel();
    var amt = parseAmt($('f-amount').value);
    if (!amt || isNaN(amt) || amt <= 0) { $('f-hint').textContent = 'ငွေပမာဏ မှန်အောင် ထည့်ပါ (0 ထက် ကြီးရမယ်)'; return; }
    var date = $('f-date').value || todayStr();
    var cat = $('f-cat').value, note = $('f-note').value.trim();
    if (isOther(cat)) { var cn = $('f-custom').value.trim(); if (cn) cat = cn; }
    $('f-hint').textContent = '';
    if (editId) {
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].id === editId) { entries[i] = { id: editId, date: date, type: formType, amount: amt, category: cat, note: note }; break; }
      }
      save(EKEY, entries);
      exitEdit();
    } else {
      entries.push({ id: uid(), date: date, type: formType, amount: amt, category: cat, note: note });
      save(EKEY, entries);
      $('f-amount').value = ''; $('f-note').value = ''; $('f-custom').value = '';
    }
    viewMonth = monthOf(date);
    renderAll();
  });

  /* ---------- totals ---------- */
  function totals(filterFn) {
    var ti = 0, to = 0;
    entries.forEach(function (e) { if (!filterFn || filterFn(e)) { if (e.type === 'in') ti += e.amount; else to += e.amount; } });
    return { i: ti, o: to, b: ti - to };
  }
  /* savings pot, derived from entries: စုငွေ (out) adds, စုငွေထုတ် (in) subtracts */
  function savingsTotal(filterFn) {
    var s = 0;
    entries.forEach(function (e) {
      if (filterFn && !filterFn(e)) return;
      if (e.type === 'out' && e.category === SAVE_OUT) s += e.amount;
      else if (e.type === 'in' && e.category === SAVE_IN) s -= e.amount;
    });
    return s;
  }

  /* ---------- history bottom balance bar ---------- */
  function monthEndStr(ym) {
    var last = new Date(parseInt(ym.slice(0, 4), 10), parseInt(ym.slice(5, 7), 10), 0).getDate();
    return ym + '-' + pad(last);
  }
  function renderHistBal() {
    var bar = $('hist-bal');
    var end = monthEndStr(viewMonth);
    var has = settings.opening !== 0 || entries.some(function (e) { return e.date <= end; });
    if (!has) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
    var t = totals(function (e) { return e.date <= end; });
    var bal = settings.opening + t.b;
    var sv = savingsTotal(function (e) { return e.date <= end; });
    var lbl = viewMonth === monthOf(todayStr()) ? 'အသုံး လက်ကျန် (လက်ရှိ)' : 'အသုံး လက်ကျန် (ဒီလ အဆုံး)';
    bar.innerHTML = '<span><span class="bb-lbl">' + lbl + ' </span><span class="bb-val' + (bal < 0 ? ' neg' : '') + '">' + fmtK(bal) + '</span></span>' +
      '<span><span class="bb-lbl">စုငွေ </span><span class="bb-val sm' + (sv < 0 ? ' neg' : '') + '">' + fmtK(sv) + '</span></span>';
    bar.style.display = 'flex';
  }

  /* ---------- render ---------- */
  function renderSummary() {
    var ts = todayStr(), tm = monthOf(ts);
    var t = totals(function (e) { return e.date === ts; });
    var m = totals(function (e) { return monthOf(e.date) === tm; });
    var all = totals(null);
    $('t-in').textContent = 'ဝင် ' + fmtK(t.i); $('t-out').textContent = 'ထွက် ' + fmtK(t.o); $('t-bal').textContent = 'ကျန် ' + fmtK(t.b);
    $('m-in').textContent = 'ဝင် ' + fmtK(m.i); $('m-out').textContent = 'ထွက် ' + fmtK(m.o); $('m-bal').textContent = 'ကျန် ' + fmtK(m.b);
    $('big-bal').textContent = fmtK(settings.opening + all.b);
    $('big-save').textContent = fmtK(savingsTotal(null));
  }

  function renderHistory() {
    $('m-label').textContent = monthLabel(viewMonth);
    var list = entries.filter(function (e) { return monthOf(e.date) === viewMonth; });
    var box = $('hist');
    if (!list.length) { box.innerHTML = '<div class="empty">ဒီလ မှတ်တမ်း မရှိသေးပါ</div>'; renderHistBal(); return; }
    var byDate = {};
    list.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });
    var dates = Object.keys(byDate).sort().reverse();
    var html = '';
    dates.forEach(function (d) {
      var dt = totals(function (e) { return e.date === d; });
      html += '<div class="day-head"><span class="d">' + esc(d) + ' (' + weekdayOf(d) + ')</span><span class="t">ဝင် ' + fmt(dt.i) + ' • ထွက် ' + fmt(dt.o) + ' • ကျန် ' + fmt(dt.b) + '</span></div>';
      byDate[d].forEach(function (e) {
        html += '<div class="row" data-id="' + e.id + '"><span><span class="cat">' + esc(e.category) + '</span>' +
          (e.note ? '<br><span class="note">' + esc(e.note) + '</span>' : '') +
          '</span><span class="amt ' + (e.type === 'in' ? 'in' : 'out') + '">' + (e.type === 'in' ? '+' : '−') + fmt(e.amount) + '</span><span class="eh">✏️</span></div>';
      });
    });
    box.innerHTML = html;
    var rows = box.querySelectorAll('.row');
    for (var i = 0; i < rows.length; i++) {
      rows[i].addEventListener('click', function () { startEdit(this.getAttribute('data-id')); });
    }
    renderHistBal();
  }

  function startEdit(id) {
    var e = null;
    entries.forEach(function (x) { if (x.id === id) e = x; });
    if (!e) return;
    setType(e.type);
    if ((formType === 'in' ? CATS_IN : CATS_OUT).indexOf(e.category) >= 0) { $('f-cat').value = e.category; $('f-custom').value = ''; }
    else { $('f-cat').value = formType === 'in' ? OTHER_IN : OTHER_OUT; $('f-custom').value = e.category; }
    syncCustom();
    $('f-amount').value = fmt(e.amount);
    $('f-note').value = e.note || '';
    $('f-date').value = e.date;
    $('f-hint').textContent = '';
    setEditMode(id);
    window.scrollTo(0, 0);
  }

  function catTotals(type) {
    var map = {};
    entries.forEach(function (e) {
      if (e.type === type && monthOf(e.date) === viewMonth) map[e.category] = (map[e.category] || 0) + e.amount;
    });
    return Object.keys(map).map(function (k) { return { cat: k, amt: map[k] }; }).sort(function (a, b) { return b.amt - a.amt; });
  }
  function renderCats() {
    var outs = catTotals('out'), ins = catTotals('in');
    var html = '';
    if (outs.length) {
      html += '<div class="sub-h">ထွက်ငွေ</div>' + outs.map(function (r) { return '<div class="cat-row"><span>' + esc(r.cat) + '</span><span class="out">' + fmtK(r.amt) + '</span></div>'; }).join('');
    }
    if (ins.length) {
      html += '<div class="sub-h">ဝင်ငွေ</div>' + ins.map(function (r) { return '<div class="cat-row"><span>' + esc(r.cat) + '</span><span class="in">' + fmtK(r.amt) + '</span></div>'; }).join('');
    }
    $('cat-body').innerHTML = html || '<div class="empty">ဒီလ မှတ်တမ်း မရှိသေးပါ</div>';
  }

  function renderAll() { renderSummary(); renderHistory(); renderCats(); }

  /* ---------- month nav ---------- */
  function shiftMonth(delta) {
    var y = parseInt(viewMonth.slice(0, 4), 10), mo = parseInt(viewMonth.slice(5, 7), 10) - 1 + delta;
    var d = new Date(y, mo, 1);
    viewMonth = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    renderHistory(); renderCats();
  }
  $('m-prev').addEventListener('click', function () { shiftMonth(-1); });
  $('m-next').addEventListener('click', function () { shiftMonth(1); });

  /* ---------- export: Excel (CSV) + Print statement ---------- */
  function monthStartBalance(ym) {
    var t = totals(function (e) { return e.date < ym + '-01'; });
    return settings.opening + t.b;
  }
  function monthEntriesSorted(ym) {
    return entries.filter(function (e) { return monthOf(e.date) === ym; }).slice().sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  }
  function csvCell(s) {
    s = String(s == null ? '' : s);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function buildCsv() {
    var start = monthStartBalance(viewMonth);
    var bal = start, ti = 0, to = 0;
    var lines = ['ATZ ဝင်ငွေ ထွက်ငွေ', monthLabel(viewMonth) + ' စာရင်း', '',
      ['ရက်စွဲ', 'အမျိုးအစား', 'ခေါင်းစဉ်', 'မှတ်ချက်', 'ဝင် (ကျပ်)', 'ထွက် (ကျပ်)', 'လက်ကျန် (ကျပ်)'].map(csvCell).join(','),
      ['', 'လ အစ လက်ကျန်', '', '', '', '', start].join(',')];
    monthEntriesSorted(viewMonth).forEach(function (e) {
      if (e.type === 'in') { bal += e.amount; ti += e.amount; } else { bal -= e.amount; to += e.amount; }
      lines.push([e.date, e.type === 'in' ? 'ဝင်ငွေ' : 'ထွက်ငွေ', e.category, e.note || '', e.type === 'in' ? e.amount : '', e.type === 'out' ? e.amount : '', bal].map(csvCell).join(','));
    });
    lines.push(['', 'စုစုပေါင်း', '', '', ti, to, bal].map(csvCell).join(','));
    lines.push(['', 'စုငွေ စုစုပေါင်း (ဒီလ အဆုံး)', '', '', '', '', savingsTotal(function (e) { return e.date <= monthEndStr(viewMonth); })].map(csvCell).join(','));
    return '\ufeff' + lines.join('\r\n');
  }
  $('btn-csv').addEventListener('click', function () {
    var fname = 'ATZ-MoneyLedger-' + viewMonth + '.csv';
    $('exp-hint').textContent = 'Excel ဖိုင် save နေ သည်…';
    if (window.Android && Android.saveTextFile) {
      Android.saveTextFile(fname, buildCsv());
    } else {
      var blob = new Blob([buildCsv()], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = fname;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
      $('exp-hint').textContent = fname + ' ဆွဲ ပြီး ✓';
    }
  });
  window.__atzSaved = function (ok, msg) { $('exp-hint').textContent = msg; };

  function buildStatement() {
    var start = monthStartBalance(viewMonth);
    var bal = start, ti = 0, to = 0;
    var rows = '<tr><td></td><td colspan="3">လ အစ လက်ကျန်</td><td class="n"></td><td class="n"></td><td class="n">' + fmt(start) + '</td></tr>';
    monthEntriesSorted(viewMonth).forEach(function (e) {
      if (e.type === 'in') { bal += e.amount; ti += e.amount; } else { bal -= e.amount; to += e.amount; }
      rows += '<tr><td>' + esc(e.date) + '</td><td>' + (e.type === 'in' ? 'ဝင်ငွေ' : 'ထွက်ငွေ') + '</td><td>' + esc(e.category) + '</td><td>' + esc(e.note || '') + '</td>' +
        '<td class="n">' + (e.type === 'in' ? fmt(e.amount) : '') + '</td><td class="n">' + (e.type === 'out' ? fmt(e.amount) : '') + '</td><td class="n">' + fmt(bal) + '</td></tr>';
    });
    rows += '<tr class="tot"><td></td><td colspan="3">စုစုပေါင်း</td><td class="n">' + fmt(ti) + '</td><td class="n">' + fmt(to) + '</td><td class="n">' + fmt(bal) + '</td></tr>';
    $('print-area').innerHTML = '<h1>ATZ ဝင်ငွေ ထွက်ငွေ</h1><div class="p-sub">' + esc(monthLabel(viewMonth)) + ' စာရင်း (ကျပ်)</div>' +
      '<table><tr><th>ရက်စွဲ</th><th>အမျိုးအစား</th><th>ခေါင်းစဉ်</th><th>မှတ်ချက်</th><th class="n">ဝင်</th><th class="n">ထွက်</th><th class="n">လက်ကျန်</th></tr>' + rows + '</table>' +
      '<div class="p-sub" style="margin-top:8px">စုငွေ စုစုပေါင်း (ဒီလ အဆုံး): ' + fmtK(savingsTotal(function (e) { return e.date <= monthEndStr(viewMonth); })) + '</div>';
  }
  $('btn-print').addEventListener('click', function () {
    buildStatement();
    if (window.Android && Android.printReport) {
      setTimeout(function () { Android.printReport(); }, 80);
    } else {
      window.print();
    }
  });

  /* ---------- share ---------- */
  $('btn-share').addEventListener('click', function () {
    var m = totals(function (e) { return monthOf(e.date) === viewMonth; });
    var all = totals(null);
    var text = 'ATZ ဝင်ငွေ ထွက်ငွေ — ' + monthLabel(viewMonth) + '\n' +
      'ဝင်: ' + fmtK(m.i) + '\nထွက်: ' + fmtK(m.o) + '\nကျန်: ' + fmtK(m.b) + '\nလက်ကျန်: ' + fmtK(settings.opening + all.b) + '\nစုငွေ စုစုပေါင်း: ' + fmtK(savingsTotal(null));
    var top = catTotals('out').slice(0, 3);
    if (top.length) {
      text += '\nထွက်ငွေ အများ ဆုံး: ' + top.map(function (r) { return r.cat + ' ' + fmtK(r.amt); }).join(', ');
    }
    if (navigator.share) {
      navigator.share({ text: text }).catch(function () {});
    } else {
      var box = $('share-box'); box.style.display = 'block'; box.value = text; box.select();
    }
  });

  /* ---------- settings + clear ---------- */
  $('s-opening').value = settings.opening ? fmt(settings.opening) : '';
  $('s-save').addEventListener('click', function () {
    var v = parseAmt($('s-opening').value);
    settings.opening = isNaN(v) ? 0 : v;
    save(SKEY, settings);
    renderAll();
  });

  var CLEAR_LABEL = 'မှတ်တမ်း အားလုံး ရှင်းမယ်', clearTimer = null;
  function disarmClear() {
    var b = $('btn-clear'); b.dataset.armed = ''; b.classList.remove('armed'); b.textContent = CLEAR_LABEL;
    if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }
  }
  $('btn-clear').addEventListener('click', function () {
    var b = $('btn-clear');
    if (b.dataset.armed !== '1') {
      b.dataset.armed = '1'; b.textContent = 'တကယ် ရှင်းမှာ သေချာလား? စတင် လက်ကျန် ပါ 0 ပြန် ထား မယ် — ထပ် နှိပ်ပါ'; b.classList.add('armed');
      if (clearTimer) clearTimeout(clearTimer);
      clearTimer = setTimeout(disarmClear, 2600);
      return;
    }
    entries = []; save(EKEY, entries);
    settings.opening = 0; save(SKEY, settings);
    $('s-opening').value = '';
    exitEdit();
    disarmClear();
    renderAll();
  });

  /* ---------- init ---------- */
  $('f-date').value = todayStr();
  setType('out');
  renderAll();
})();
</script>
</body>
</html>
